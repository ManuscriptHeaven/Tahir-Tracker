name: Deploy Tahir Tracker to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tahir-tracker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build production app
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 46960ac6c9b58d562d6bc646f3b6b318
        run: npx wrangler pages deploy dist --project-name=tahir-tracker --branch=main

      - name: Verify production URL responds
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://tahir-tracker.pages.dev/ > /dev/null
